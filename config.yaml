# security-forge — active config for THIS copy. Set target.repo before the first run.
# See config.example.yaml for all options and comments.

target:
  repo: ""            # set the target repo URL, or pass it via SECFORGE_TARGET_REPO
  branch: ""          # default branch
  depth: 1            # shallow clone: baseline static analysis doesn't need full history

agent:
  # Which AI runs each session. Default is Claude Code (unchanged behavior).
  #   litellm  = native, no external CLI (pip install litellm); model e.g. openai/gpt-5
  #   codex/gemini/aider = wrap that headless CLI; cli-adapter = ad-hoc (--agent-cmd)
  # Override anything on the CLI (--backend/--model/--agent-*). See config.example.yaml.
  backend: claude-code          # claude-code | litellm | cli-adapter | codex | gemini | aider
  model: ""                     # e.g. openai/gpt-5 (litellm) or gpt-5 / gemini-2.5-pro (a CLI)
  litellm: { max_turns: 500, temperature: null, max_context_tokens: 120000 }
  backends:
    codex:  { command: "codex exec --model {model} --dangerously-bypass-approvals-and-sandbox {prompt}", output: jsonl }
    gemini: { command: "gemini -m {model} --yolo -p {prompt}", output: text }
    aider:  { command: "aider --model {model} --yes --message {prompt}", output: text }

analysis:
  focus:
    - authentication / authorization
    - input validation / injection (SQLi, command, template, deserialization)
    - SSRF / path traversal / file upload
    - secrets & credential handling
    - insecure crypto & session management
    - access control / IDOR
  changed_only_after_first_scan: true
  max_verify_per_cycle: 3
  max_recon_agents: 3            # cap parallel recon-cartographers (large-repo fan-out guard)
  max_authz_agents: 4           # cap parallel authz-analyzers (area agents + auth-mechanism)
  max_analyzer_agents: 6        # cap parallel code-analyzer (dataflow) subagents
  # On a very large repo, DON'T try to fully analyze + verify in one cycle: cap
  # fan-out to these budgets, cover the highest-value areas first, record partial
  # coverage, and let the next (incremental) cycle continue from the persisted model.
  # Only user-reachable, exploitable AND valuable issues count. Never record
  # theoretical / best-practice noise (bare MD5, missing headers, etc.).
  only_exploitable_valuable: true
  user_reachable_only: true

report:
  # Hard floor — MEDIUM/HIGH/CRITICAL are recorded and emitted; nothing below.
  # The confirmation standard does NOT soften as severity drops: a MEDIUM must be
  # as well-evidenced as a CRITICAL (confirmed, traced to the sink, user-reachable,
  # concrete impact, FP filter named). MEDIUM = the attacker's precondition,
  # never the analyst's uncertainty.
  min_severity: MEDIUM
  send_verified: true
  send_high_sev_unverified: true
  min_severity_unverified: MEDIUM
  executive_summary: true        # per-target EXECUTIVE_SUMMARY.md, refreshed each cycle
  cycle_summary: true
  attach_report_file: true
  progress: true                 # emit per-phase progress lines so you can watch a run
  progress_silent: true          # …tagged as progress (not a finding/summary notice)

verify:
  enabled: true
  network_egress: true
  boot_timeout_seconds: 120

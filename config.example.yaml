# security-forge — per-target configuration.
# Copy this file to config.yaml (in THIS folder) and set your target.
# Each copy of the security-forge folder analyzes exactly one target repo.

target:
  # GitHub (or any git) URL to clone into ./target and analyze.
  # For private repos use an authenticated URL, e.g.
  #   https://<user>:<token>@github.com/owner/repo.git
  # Or a LOCAL SOURCE FOLDER — an absolute/relative path or file:// URL (a git repo
  # is cloned with history; a plain folder is copied). Keyed as local/<foldername>.
  #   repo: /home/me/projectX            # or ./services/api  or  file:///srv/code/app
  repo: ""                       # e.g. https://github.com/owner/repo.git  |  /path/to/local/folder
  branch: ""                     # blank = default branch
  depth: null                    # null = full history (needed for secret scanning); or an int for shallow

agent:
  # WHICH AI runs each analysis session. The whole engine (scripts, sandbox,
  # verify-poc gate, DB) is provider-neutral; only this picks the driver.
  # Precedence for every field: CLI flag > this block > built-in default.
  #   claude-code   Claude Code CLI (default)
  #   litellm       NATIVE, no external CLI — our own tool loop over LiteLLM, so any
  #                 LiteLLM model works directly (needs `pip install litellm`)
  #   cli-adapter   wrap an ad-hoc headless agentic CLI (see cli: below)
  #   <preset>      any name under `backends:` (codex / gemini / aider examples)
  backend: claude-code           # claude-code | litellm | cli-adapter | <preset>
  model: ""                      # default model; claude-code normalizes (opus4.8 -> claude-opus-4-8),
                                 # everything else verbatim. For litellm use a LiteLLM string,
                                 # e.g. openai/gpt-5, gemini/gemini-2.5-pro, anthropic/claude-3-7-sonnet, ollama/llama3

  # Tuning for the native `litellm` backend (only used when backend: litellm).
  litellm:
    max_turns: 500               # max tool-use turns per session (wall clock still bounded by --timeout)
    temperature: null            # null = provider default
    max_context_tokens: 120000   # trim old tool output above this to stay in the model's window
    api_base: ""                 # override the model endpoint URL: a self-hosted OpenAI-compatible
                                 # server, Ollama/vLLM, or a LiteLLM proxy (e.g. http://localhost:4000).
                                 # Key stays in the env: OPENAI_API_KEY, or SECFORGE_LLM_API_KEY for a
                                 # generic endpoint. (CLI: --agent-base-url)

  # Ad-hoc wrapper for one-off use: `--backend cli-adapter` runs this template.
  cli:
    command: ""                  # e.g. "codex exec --model {model} --dangerously-bypass-approvals-and-sandbox {prompt}"
    output: text                 # text (tail the log) | jsonl (parse Claude-style stream-json events)

  # NAMED PRESETS — your registry of agent "types". Select one with `--backend <name>`
  # (e.g. `--backend codex --model gpt-5`). {prompt} and {model} are substituted;
  # {prompt} stays a single argv element (no shell), provider keys come from .env.
  # These are EXAMPLES — adjust the exact flags to the CLI/version you have installed.
  backends:
    codex:                       # OpenAI Codex CLI (headless); model e.g. gpt-5, o4-mini
      command: "codex exec --model {model} --dangerously-bypass-approvals-and-sandbox {prompt}"
      output: jsonl
    gemini:                      # Google Gemini CLI; model e.g. gemini-2.5-pro
      command: "gemini -m {model} --yolo -p {prompt}"
      output: text
    aider:                       # aider (uses LiteLLM under the hood → 100+ providers)
      command: "aider --model {model} --yes --message {prompt}"
      output: text

analysis:
  # How aggressive the agentic pass is. The skill reads these.
  focus:                         # optional: bias analysis toward these areas
    - authentication / authorization
    - input validation / injection (SQLi, command, template, deserialization)
    - SSRF / path traversal / file upload
    - secrets & credential handling
    - insecure crypto & session management
    - access control / IDOR
  changed_only_after_first_scan: true   # after the first full scan, focus on changed files each cycle
  max_verify_per_cycle: 3        # cap dynamic-verification attempts per cycle (cost/time guard)
  max_recon_agents: 3            # cap concurrent recon-cartographer subagents (large-repo fan-out guard)
  max_authz_agents: 4            # cap concurrent authz-analyzer subagents (area agents + the auth-mechanism agent)
  max_analyzer_agents: 6         # cap concurrent code-analyzer (dataflow) subagents
  # Large-repo strategy: these caps bound EACH phase's fan-out. A session runs under
  # a hard wall-clock deadline (orchestrate.py --timeout, default 1h), so on a big
  # codebase do NOT attempt exhaustive coverage in one cycle — cap fan-out here,
  # analyze the highest-value areas first, record partial coverage, and let the next
  # incremental cycle continue from the persisted knowledge/ model.
  only_exploitable_valuable: true  # ignore theoretical/best-practice noise (bare MD5, headers, …)
  user_reachable_only: true        # only analyze sinks reachable from a user-facing entry point

report:
  # Local delivery policy — NOTIFY ONLY (stdout + notifications.log).
  # MEDIUM/HIGH/CRITICAL are recorded and emitted; nothing below ever is.
  # The confirmation standard does NOT soften as severity drops — a MEDIUM must be
  # as well-evidenced as a CRITICAL (confirmed in code, traced to the sink,
  # user-reachable, concrete impact, false-positive filter named). MEDIUM describes
  # the attacker's precondition, never the analyst's uncertainty.
  # Advisories + PoC bundles: verified HIGH/CRITICAL only. MEDIUMs are delivered via
  # the notification channel and the per-repo EXECUTIVE_SUMMARY.md.
  min_severity: MEDIUM           # hard floor for recording/reporting anything
  send_verified: true            # emit as soon as reachability/repro is confirmed
  send_high_sev_unverified: true # also flag candidates awaiting/failing verification
  min_severity_unverified: MEDIUM # threshold for the "unverified candidate" alerts
  executive_summary: true        # per-target EXECUTIVE_SUMMARY.md, rewritten each cycle
  cycle_summary: true            # emit a one-line summary each cycle
  attach_report_file: true       # reference a markdown report file for confirmed findings
  progress: true                 # emit per-phase progress lines so you can watch a run live
  progress_silent: true          # …tagged as progress (not a finding/summary notice)
  # Central report folder — every finding across ALL projects is written here as a flat,
  # plain-text <date>_<project>_<severity>_<issue>.txt plus a greppable INDEX.txt, so you
  # can browse the vulnerabilities in one place regardless of project. Default: <data>/reports.
  # Override with an absolute path (or SECFORGE_REPORTS_DIR / orchestrate --reports-dir):
  reports_dir: ""                # e.g. /home/me/security-reports

verify:
  # Dynamic-verification sandbox behavior.
  enabled: true
  network_egress: true           # allow the target container to reach the internet (often needed to boot)
  boot_timeout_seconds: 120

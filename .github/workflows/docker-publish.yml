name: Publish Docker image (GHCR)

# Build and push the security-forge image to GitHub Container Registry on every
# push (any branch) and tag. Multi-arch: linux/amd64 + linux/arm64 (Raspberry Pi).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # required to push to ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # -> ghcr.io/<owner>/<repo>  (lowercased automatically)
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Release tags: pushing git tag v1.2.3 publishes image tags 1.2.3, 1.2, 1.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # skip the bare major "0" for 0.x releases (it isn't meaningful yet)
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Branch pushes: image tagged with the branch name + a short commit sha.
            type=ref,event=branch
            type=sha,format=short
            # `latest` tracks the default branch only.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Speed up repeat builds (the Node/Claude + apt layers are the slow part).
          cache-from: type=gha
          cache-to: type=gha,mode=max

# security-forge UI — continuous-scanning control plane.
#   cd webapp && OPENAI_API_KEY=sk-... docker compose up --build
#   open http://localhost:8000   (login root / root — you'll be forced to change it)
#
# Static analysis only — no Docker socket needed. All data persists in ./sf-data.
services:
  ui:
    build:
      context: ..                 # repo root, so the engine is bundled
      dockerfile: webapp/Dockerfile
    image: ghcr.io/zzzteph/security-forge-ui:latest
    ports:
      - "8000:8000"
    volumes:
      - ./sf-data:/data           # db, knowledge, logs — all persisted here
    environment:
      # provider keys for the scan backend (set the ones you use)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SECFORGE_LLM_API_KEY: ${SECFORGE_LLM_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}   # private repo listing/cloning
      # stable session-cookie secret across restarts (else one is generated)
      SECFORGE_UI_SECRET: ${SECFORGE_UI_SECRET:-}
    restart: unless-stopped

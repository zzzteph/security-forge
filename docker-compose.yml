# security-forge — one image, run as UI (here) or CLI (docker run … <orchestrator args>).
#
#   OPENAI_API_KEY=sk-... docker compose up --build
#   open http://localhost:8000   (login root / root — you'll be forced to change it)
#
#   # one-off CLI scan with the same image:
#   docker compose run --rm security-forge --path /data/mysrc --backend litellm --model openai/gpt-5
#
# Static analysis only (no verification → no Docker socket needed). Data persists in ./sf-data.
services:
  security-forge:
    build: .
    image: ghcr.io/zzzteph/security-forge:latest
    command: ["ui"]                 # omit / override with orchestrator args for CLI mode
    ports:
      - "8000:8000"
    volumes:
      - ./sf-data:/data             # db, knowledge, logs, agent logins — all persisted here
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SECFORGE_LLM_API_KEY: ${SECFORGE_LLM_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SECFORGE_UI_SECRET: ${SECFORGE_UI_SECRET:-}
    restart: unless-stopped
